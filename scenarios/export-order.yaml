id: export-order
code: ex
title: Export order & customs
summary: >-
  A paper mill in Canada orders a refiner. The Sales Hub in Vienna checks credit, export control,
  customs and shipping. Hazardous cargo needs a human decision.
color: "#eda100"
orchestrator:
  id: ex-orchestrator
  name: Sales Hub
  description: Turns customer orders into delivered goods.
  city: Vienna
  country: AT
  lat: 48.2082
  lon: 16.3738
agents:
  - id: ex-credit-check
    name: Credit Check
    description: Rates the customer's credit risk.
    city: Vienna
    country: AT
    lat: 48.2082
    lon: 16.3738
    feature: streaming
    mode: llm
    skills:
      - { id: assess-credit, name: Assess credit, description: Rate a customer's payment risk, tags: [finance] }
    llm:
      system: You are a credit analyst for industrial equipment exports. Answer in at most three short sentences.
      max_tokens: 160
    script:
      - { say: "Fetching payment history of Laurentide Paper Inc…", wait: 2.5s }
      - { say: "Checking credit insurer limits…", wait: 2.5s }
      - llm: "Customer order: {{request}}. Give a short credit verdict."
        tools: [ex-tariffs, ex-orders]
        prompt_from: { server: ex-tariffs, name: credit_review }
        fallback: "Low risk: all 14 invoices paid on time and the order is within the insurer limit. Approve with standard terms."
      - artifact: { name: credit, data: { rating: A-, limit_eur: 6000000, terms: 30 days net } }
      - { complete: "Credit approved." }
  - id: ex-export-control
    name: Export Control
    description: Screens goods and end users against export regulations.
    city: Brussels
    country: BE
    lat: 50.8503
    lon: 4.3517
    feature: multi_turn
    skills:
      - { id: screen-export, name: Screen export, description: Check goods and end user, tags: [compliance] }
    script:
      - { say: "Classifying the refiner under EU dual-use rules…", wait: 2.5s }
      - { input_required: "Please provide the end-user certificate number." }
      - { resource: { server: ex-tariffs, uri: "tariffs://ex/rules/dual-use" } }
      - { say: "Validating certificate {{input}}…", wait: 1.5s }
      - { tool: { server: ex-tariffs, name: screen_party, args: { name: Laurentide Paper Inc } } }
      - artifact: { name: clearance, data: { classification: not dual-use, licence: none required } }
      - { complete: "Export cleared." }
  - id: ex-customs
    name: Customs Broker
    description: Files export and import declarations. Takes a while; reports by push notification.
    city: Rotterdam
    country: NL
    lat: 51.9244
    lon: 4.4777
    feature: long_task_push
    skills:
      - { id: file-customs, name: File customs, description: Prepare export and import declarations, tags: [customs] }
    script:
      - { say: "Drafting the EU export declaration…", wait: 1s }
      - { tool: { server: ex-tariffs, name: file_declaration, args: { order: "88-1203" } } }
      - { say: "Submitting to Dutch customs…", wait: 3s }
      - { say: "Waiting for release from customs…", wait: 3s }
      - { say: "Pre-filing the Canadian import declaration…", wait: 3s }
      - artifact: { name: declaration, data: { mrn: 26NL0000000123456, status: released } }
      - { complete: "Customs released." }
  - id: ex-shipping
    name: Shipping
    description: Books ocean freight. Hazardous cargo needs a human decision.
    city: Singapore
    country: SG
    lat: 1.3521
    lon: 103.8198
    feature: restricted
    skills:
      - { id: book-freight, name: Book freight, description: Book ocean freight, tags: [shipping] }
      - { id: restricted-hazardous-cargo, name: Ship hazardous cargo, description: Declare dangerous goods (humans only), tags: [shipping, critical] }
    script:
      - { say: "Trying to release the goods directly from the order system…", wait: 1s }
      - { tool: { server: ex-orders, name: restricted_release_goods, args: { order: "88-1203" }, expect: denied } }
      - { say: "Searching sailings Rotterdam → Montreal…", wait: 1.5s }
      - { tool: { server: ex-orders, name: container_status, args: { port: Rotterdam } } }
      - artifact: { name: booking, data: { vessel: MSC Aurora, departs: in 5 days, container: 40ft HC } }
      - { complete: "Freight booked." }
plan:
  - { step: credit, agent: ex-credit-check, call: stream, skill: assess-credit, text: "Order 88-1203: TwinFlo refiner for Laurentide Paper Inc, Trois-Rivières, 4.2 M EUR", say: "Sales Hub streams a credit check." }
  - { step: export, agent: ex-export-control, call: send, skill: screen-export, text: "Screen TwinFlo refiner, end user Laurentide Paper Inc, Canada", reply: "EUC-CA-2026-7781", say: "Sales Hub asks Export Control for clearance." }
  - { step: customs, agent: ex-customs, call: push, skill: file-customs, text: "File export and import declarations for order 88-1203", say: "Sales Hub hands customs to the broker and waits for a push notification." }
  - { step: hazmat, agent: ex-shipping, call: send, skill: restricted-hazardous-cargo, text: "Declare the refiner's lubricant drums as dangerous goods", expect: denied, say: "Sales Hub tries to declare hazardous cargo. The gateway policy should refuse it." }
  - { step: freight, agent: ex-shipping, call: send, skill: book-freight, text: "Book ocean freight Rotterdam → Montreal, one 40ft container", parallel: true, say: "Sales Hub books regular freight." }
closing: "Order 88-1203 ready to ship."

mcp_servers:
  - id: ex-tariffs
    role: data
    name: Tariff & Sanctions DB
    description: Customs tariffs, sanctions lists and export rules.
    city: Luxembourg
    country: LU
    lat: 49.6116
    lon: 6.1319
    tools:
      - name: screen_party
        description: Screen a company against sanctions lists.
        params: [{ name: name, type: string }]
        result: "{{name}}: no match on EU, UN or OFAC sanctions lists."
      - name: tariff_lookup
        description: Duty for a tariff code into a country.
        params: [{ name: hs_code, type: string }, { name: country, type: string }]
        result: "HS {{hs_code}} into {{country}}: 0 % duty under CETA, 5 % GST on import."
      - name: file_declaration
        description: File the electronic export declaration (slow).
        params: [{ name: order, type: string }]
        progress: { steps: 4, every: 1.5s, say: "Customs system step {{step}} of {{steps}}…" }
        result: "Export declaration for order {{order}} accepted, MRN 26LU0000000123456."
    resources:
      - uri: "tariffs://ex/rules/dual-use"
        name: EU dual-use regulation, refiner excerpt
        mime: text/markdown
        text: |
          # Regulation (EU) 2021/821, Annex I
          Disc refiners for pulp are not listed. No licence is needed unless the end user is on a sanctions list
          or the goods are for military use. Keep the end-user certificate for five years.
    prompts:
      - name: credit_review
        description: System prompt for a credit check
        text: You are a credit analyst for industrial exports. Use the tools to get data before answering.
  - id: ex-orders
    role: ops
    name: Order Management
    description: Orders, payments and containers.
    city: Montreal
    country: CA
    lat: 45.5019
    lon: -73.5674
    tools:
      - name: order_history
        description: Order and payment history of a customer.
        params: [{ name: customer, type: string }]
        result: "{{customer}}: 14 orders since 2019, all paid within 35 days, open balance 0 EUR."
        data: { orders: 14, avg_days_to_pay: 31, open_balance_eur: 0 }
      - name: container_status
        description: Free containers at a port.
        params: [{ name: port, type: string }]
        result: "{{port}}: 6 free 40ft high-cube containers, next sailing to Montreal in 5 days."
      - name: restricted_release_goods
        description: Release goods for shipping without customs clearance (write; humans only).
        params: [{ name: order, type: string }]
        result: "Order {{order}} released."
        write: true
