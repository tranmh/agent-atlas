# GENERATED by atlasgen from scenarios/*.yaml. Do not edit; run `make gen`.
# Included by docker-compose.yml. One container per agent and per orchestrator.
# Agents publish no ports: the only way in is through agentgateway.

x-agent: &agent
  image: agent-atlas/agent:dev
  build:
    context: .
    dockerfile: build/go.Dockerfile
    args:
      SERVICE: agent
  restart: on-failure
  healthcheck:
    test: ["CMD", "/app/agent", "--healthcheck"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 5s

x-orchestrator: &orchestrator
  image: agent-atlas/orchestrator:dev
  build:
    context: .
    dockerfile: build/go.Dockerfile
    args:
      SERVICE: orchestrator
  restart: on-failure
  healthcheck:
    test: ["CMD", "/app/orchestrator", "--healthcheck"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 5s

services:

  # ---- EX · Export order & customs ----
  ex-orchestrator:
    <<: *orchestrator
    environment:
      ORCH_ID: ex-orchestrator
      ORCH_PUBLIC_URL: http://ex-orchestrator:8090
      GATEWAY_URL: http://agentgateway:3000
      VISUALIZER_URL: http://visualizer:8095
      EVENT_PAYLOAD_MAX_BYTES: ${EVENT_PAYLOAD_MAX_BYTES:-16384}
  ex-credit-check:
    <<: *agent
