# agent-atlas: A2A agents on a world map behind agentgateway.
# `make up` (= docker compose up -d --build --wait). Settings come from .env.
# Container ports are fixed; only the HOST side is configurable (*_HOST_PORT).
# agentgateway, the 20 agents, 5 orchestrators and 10 MCP servers are generated into compose.agents.yml (`make gen`).
name: agent-atlas

include:
  - compose.agents.yml

services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: on-failure
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_HOST_PORT:-16686}:16686"

  visualizer:
    image: agent-atlas/visualizer:dev
    build:
      context: .
      dockerfile: build/go.Dockerfile
      args:
        SERVICE: visualizer
    restart: on-failure
    user: "${UID_GID:-1000:1000}"
    environment:
      SESSIONS_DIR: /data/sessions
      EVENT_PAYLOAD_MAX_BYTES: ${EVENT_PAYLOAD_MAX_BYTES:-16384}
      RUN_STAGGER: 2s
    volumes:
      - ./data/sessions:/data/sessions
    ports:
      - "${VISUALIZER_HOST_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD", "/app/visualizer", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    image: agent-atlas/web:dev
    build:
      context: ./web
      args:
        NEXT_PUBLIC_VISUALIZER_URL: http://localhost:${VISUALIZER_HOST_PORT:-8095}
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:${GATEWAY_HOST_PORT:-8000}
        NEXT_PUBLIC_JAEGER_URL: http://localhost:${JAEGER_HOST_PORT:-16686}
        NEXT_PUBLIC_GATEWAY_UI_URL: http://localhost:${GATEWAY_UI_HOST_PORT:-15000}/ui
    restart: on-failure
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      visualizer:
        condition: service_healthy
