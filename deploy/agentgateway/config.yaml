# GENERATED by atlasgen from scenarios/*.yaml. Do not edit; run `make gen`.
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# One gateway for everything:
#   :3000  A2A traffic. One route per worker agent at /agents/<agent id>. The a2a policy makes the
#          gateway understand A2A: it rewrites the URL in agent cards so clients never bypass it,
#          and it logs the JSON-RPC method, task state and contextId of every call.
#   :3100  OpenAI-compatible LLM route. Agents in mode "llm" call it; it forwards to Ollama on the host.
#   :15000 Admin UI.
config:
  adminAddr: 0.0.0.0:15000
  logging:
    format: json

frontendPolicies:
  # Every request becomes a span in Jaeger (http://localhost:16686).
  tracing:
    host: jaeger:4317
    randomSampling: true
  # The access log is what the gateway "sees". It goes to stdout (docker logs) and, over OTLP,
  # to the visualizer, which shows it next to what the agents report.
  accessLog:
    add:
      run_id: 'request.headers["x-run-id"]'
      caller: 'request.headers["x-caller"]'
    otlp:
      host: visualizer:8095
      protocol: http
      path: /otlp/v1/logs

gateways:
  default:
    port: 3000
  llm:
    port: 3100

llm:
  gateways: llm
  models:
  # Any model name is passed through to Ollama (the agents ask for $LLM_MODEL).
  - name: "*"
    provider: ollama
    params:
      baseUrl: http://host.docker.internal:11434/v1

routes:

# ---- EX · Export order & customs (orchestrator: Sales Hub, Vienna) ----

# Credit Check (Vienna): streaming (SendStreamingMessage). Retry policy: a 503 is retried (chaos demo).
- name: ex-credit-check
  matches:
  - path:
      pathPrefix: /agents/ex-credit-check
  policies:
    urlRewrite:
      path:
        prefix: /
    cors:
      allowOrigins: ['*']
      allowHeaders: [content-type, cache-control, x-run-id, x-caller]
    a2a: {}
    retry:
      attempts: 3
      backoff: 500ms
      codes: [503]
  backends:
  - host: ex-credit-check:8080

# Export Control (Brussels): multi-turn (input-required). No extra policy: the clean reference route.
- name: ex-export-control
  matches:
  - path:
      pathPrefix: /agents/ex-export-control
  policies:
    urlRewrite:
      path:
        prefix: /
    cors:
      allowOrigins: ['*']
      allowHeaders: [content-type, cache-control, x-run-id, x-caller]
    a2a: {}
  backends:
  - host: ex-export-control:8080

# Customs Broker (Rotterdam): long task + push notification. Delay policy: POSTs wait 2 s (a slow link).
- name: ex-customs
  matches:
  - path:
      pathPrefix: /agents/ex-customs
  policies:
    urlRewrite:
      path:
        prefix: /
    cors:
      allowOrigins: ['*']
      allowHeaders: [content-type, cache-control, x-run-id, x-caller]
    a2a: {}
    delay:
      duration: 'request.method == "POST" ? 2000 : 0'
  backends:
  - host: ex-customs:8080

# Shipping (Singapore): restricted. Authorization policy: only its orchestrator, and no restricted-* skills.
- name: ex-shipping
  matches:
  - path:
      pathPrefix: /agents/ex-shipping
  policies:
    urlRewrite:
      path:
        prefix: /
    cors:
      allowOrigins: ['*']
      allowHeaders: [content-type, cache-control, x-run-id, x-caller]
    a2a: {}
    authorization:
      rules:
      # Anyone may read the agent card.
      - allow: 'request.method == "GET"'
      # Only ex-orchestrator may call, and never a skill starting with "restricted-".
      - allow: 'request.headers["x-caller"] == "ex-orchestrator" && !string(default(json(request.body).params.message.metadata.skill, "")).startsWith("restricted-")'
  backends:
  - host: ex-shipping:8080

